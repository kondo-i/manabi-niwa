<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
<title id="title">AとBの移動距離と時間</title>
<desc id="desc">横軸は時間0から4秒、縦軸は移動距離0から6メートル。Aは0秒0メートルから4秒6メートル、Bは0秒0メートルから4秒4メートルまでの直線。</desc>
<rect width="320" height="240" fill="#fff"/>
<g stroke="#ddd" stroke-width="1"><path d="M60 40H280M60 90H280M60 140H280M170 40V190M280 40V190"/></g>
<path d="M60 30V190H295" fill="none" stroke="#333" stroke-width="2"/>
<g font-family="sans-serif" font-size="13" fill="#222" text-anchor="middle">
<text x="60" y="209">0</text><text x="170" y="209">2</text><text x="280" y="209">4</text>
<text x="44" y="194">0</text><text x="44" y="144">2</text><text x="44" y="94">4</text><text x="44" y="44">6</text>
<text x="170" y="231">時間 (s)</text><text x="62" y="18">移動距離 (m)</text>
</g>
<path d="M60 190L280 40" stroke="#245eaa" stroke-width="3" fill="none"/>
<path d="M60 190L280 90" stroke="#ad4b14" stroke-width="3" stroke-dasharray="8 4" fill="none"/>
<g fill="#245eaa"><circle cx="170" cy="115" r="4"/><circle cx="280" cy="40" r="4"/></g>
<g fill="#ad4b14"><circle cx="170" cy="140" r="4"/><circle cx="280" cy="90" r="4"/></g>
<g font-family="sans-serif" font-size="16" font-weight="bold"><text x="286" y="43" fill="#245eaa">A</text><text x="286" y="94" fill="#ad4b14">B</text></g>
</svg>
