<svg xmlns="http://www.w3.org/2000/svg" width="320" height="300" viewBox="0 0 320 300" role="img" aria-labelledby="title desc">
<title id="title">水中の直方体の上面と下面に働く力</title>
<desc id="desc">物体は水面より下にある。上面に下向き2 N、下面に上向き3 N。側面の力は打ち消し合う。</desc>
<defs><marker id="arrow-down" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#ad4b14"/></marker><marker id="arrow-up" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#245eaa"/></marker></defs>
<rect width="320" height="300" fill="#fff"/>
<rect x="25" y="40" width="270" height="240" fill="#e6f3ff"/>
<path d="M25 40H295" stroke="#5591c4" stroke-width="2"/>
<rect x="100" y="120" width="120" height="40" fill="#f4f2e8" stroke="#333" stroke-width="2"/>
<path d="M160 75V118" stroke="#ad4b14" stroke-width="3" marker-end="url(#arrow-down)"/>
<path d="M160 227V162" stroke="#245eaa" stroke-width="3" marker-end="url(#arrow-up)"/>
<g font-family="sans-serif" font-size="15" fill="#222">
<text x="30" y="30">水面</text>
<text x="175" y="88" fill="#ad4b14">下向き 2 N</text>
<text x="175" y="209" fill="#245eaa">上向き 3 N</text>
<text x="145" y="145">物体</text>
<text x="29" y="293" font-size="12">模式図：側面の力は打ち消し合う</text>
</g>
</svg>
